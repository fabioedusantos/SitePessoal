name: fbsantos-backend-dev

# IMPORTANTE: antes de recriar os serviços, migre o antigo volume
# fbsantos-backend-dev_media_data para docker/dev/data/uploads/.
# Consulte docs/production-deployment.md.

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    env_file: .env
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  composer:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile
    restart: "no"
    volumes:
      - ../../app:/var/www/html
      - vendor:/var/www/html/vendor
    command: composer install --no-interaction --no-progress --prefer-dist

  migrate:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile
    restart: "no"
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      MIGRATIONS_PATH: /var/www/database/migrations
    depends_on:
      db:
        condition: service_healthy
      composer:
        condition: service_completed_successfully
    volumes:
      - ../../app:/var/www/html
      - ../../database:/var/www/database:ro
      - vendor:/var/www/html/vendor
    command: php bin/migrate.php

  app:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
      composer:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    volumes:
      - ../../app:/var/www/html
      - vendor:/var/www/html/vendor
      - ./data/uploads:/var/www/html/public/uploads
    command: >-
      sh -lc 'mkdir -p /var/www/html/public/uploads && (chown -R www-data:www-data /var/www/html/public/uploads 2>/dev/null || true) && exec php-fpm'

  nginx:
    image: nginx:1.30.5-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "8080:80"
    volumes:
      - ../../app/public:/var/www/html/public:ro
      - ./data/uploads:/var/www/html/public/uploads:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db_data:
  vendor:
