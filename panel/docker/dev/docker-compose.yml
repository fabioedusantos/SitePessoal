name: fbsantos-panel-dev

services:
  app:
    image: node:22-alpine
    working_dir: /app
    restart: unless-stopped
    env_file: .env
    volumes:
      - ../../app:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  node_modules:
