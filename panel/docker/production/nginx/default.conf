map $http_cf_connecting_ip $fbsantos_panel_client_key {
    default $http_cf_connecting_ip;
    "" $binary_remote_addr;
}

limit_req_zone $fbsantos_panel_client_key zone=panel_login:10m rate=8r/m;
limit_req_zone $fbsantos_panel_client_key zone=panel_api:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header_inherit merge;
    limit_req_status 429;
    client_header_timeout 15s;
    client_body_timeout 30s;
    keepalive_timeout 30s;
    send_timeout 60s;

    client_max_body_size 14m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self'; frame-src https://fbsantos.com.br; upgrade-insecure-requests" always;

    location = /api/v1/auth/login {
        limit_req zone=panel_login burst=3 nodelay;
        proxy_pass http://fbsantos-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ^~ /api/v1/admin/ {
        limit_req zone=panel_api burst=40 nodelay;
        proxy_pass http://fbsantos-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-CSRF-Token $http_x_csrf_token;
        proxy_hide_header Access-Control-Allow-Origin;
    }

    location ^~ /api/ {
        return 404;
    }

    location ^~ /uploads/ {
        proxy_pass http://fbsantos-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|jpg|jpeg|png|gif|svg|ico|webp|avif|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
