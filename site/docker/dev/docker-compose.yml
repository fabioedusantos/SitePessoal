name: fbsantos-site-dev

services:
  install:
    image: node:22-alpine
    working_dir: /app
    restart: "no"
    volumes:
      - ../../app:/app
      - node_modules:/app/node_modules
    command: >-
      sh -lc '
        set -eu;
        HASH="$$(cat package.json package-lock.json | sha256sum | cut -d " " -f 1)";
        INSTALLED_HASH="$$(cat node_modules/.fbsantos-lock-hash 2>/dev/null || true)";
        if [ ! -e node_modules/.bin/nuxt ] || [ "$$INSTALLED_HASH" != "$$HASH" ]; then
          echo "Instalando/atualizando dependências do site...";
          npm install --prefer-offline --no-audit --no-fund;
          HASH="$$(cat package.json package-lock.json | sha256sum | cut -d " " -f 1)";
          printf "%s" "$$HASH" > node_modules/.fbsantos-lock-hash;
          echo "Dependências do site prontas.";
        else
          echo "Dependências do site já estão atualizadas.";
        fi'

  app:
    image: node:22-alpine
    working_dir: /app
    restart: "no"
    env_file: .env
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:8080/api/v1}
      # Dentro do container, localhost aponta para o próprio Nuxt. Em DEV o SSR deve acessar o backend pelo host.
      NUXT_API_BASE_INTERNAL: http://host.docker.internal:8080/api/v1
      NUXT_PUBLIC_HCAPTCHA_SITE_KEY: ${NUXT_PUBLIC_HCAPTCHA_SITE_KEY:-10000000-ffff-ffff-ffff-000000000001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../app:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      install:
        condition: service_completed_successfully
    command: npm run dev -- --host 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/favicon.svg >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  node_modules:
