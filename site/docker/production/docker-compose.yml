# Site público (Nuxt SSR + nginx + Cloudflare Tunnel).
# A rede da API e a dependência da saúde do backend vêm do Compose raiz.
services:
  site-app:
    build:
      context: ../..
      dockerfile: docker/production/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      NUXT_PUBLIC_API_BASE: /api/v1
      NUXT_API_BASE_INTERNAL: http://fbsantos-api/api/v1
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/favicon.svg').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - site_net

  site-nginx:
    image: nginx:1.30.5-alpine
    restart: unless-stopped
    depends_on:
      site-app:
        condition: service_healthy
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/favicon.svg || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      site_net:
        aliases:
          - nginx

  site-cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    env_file: .env
    depends_on:
      site-nginx:
        condition: service_healthy
    command: tunnel --no-autoupdate run
    networks:
      - site_net

networks:
  site_net:
    name: fbsantos-site
