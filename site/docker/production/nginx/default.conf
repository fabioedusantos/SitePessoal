map $http_cf_connecting_ip $fbsantos_client_key {
    default $http_cf_connecting_ip;
    "" $binary_remote_addr;
}

limit_req_zone $fbsantos_client_key zone=public_api:10m rate=30r/s;
limit_req_zone $fbsantos_client_key zone=contact_api:10m rate=10r/m;

# Re-resolução via DNS interno do Docker: contêineres do Nuxt e da API podem
# trocar de IP durante um deploy. Sem `resolve`, nginx mantém o IP antigo até
# ser reiniciado, podendo devolver 502 após recriar os serviços.
# NGINX 1.30 (imagem configurada no Compose) suporta `resolve` em upstreams.
upstream fbsantos_site_nuxt {
    zone fbsantos_site_nuxt 64k;
    server site-app:3000 resolve;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;
}

upstream fbsantos_site_api {
    zone fbsantos_site_api 64k;
    server fbsantos-api:80 resolve;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    add_header_inherit merge;
    limit_req_status 429;
    client_header_timeout 15s;
    client_body_timeout 30s;
    keepalive_timeout 30s;
    send_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    # O site pode ser embutido apenas pelo painel para pré-visualização.
    # X-Frame-Options: DENY/SAMEORIGIN bloquearia o iframe entre subdomínios;
    # a diretiva frame-ancestors é a proteção seletiva.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self' https://painel.fbsantos.com.br; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://static.cloudflareinsights.com https://hcaptcha.com https://*.hcaptcha.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://hcaptcha.com https://*.hcaptcha.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com https://*.google-analytics.com https://cloudflareinsights.com https://hcaptcha.com https://*.hcaptcha.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://hcaptcha.com https://*.hcaptcha.com; media-src 'self' https:; upgrade-insecure-requests" always;

    location = /api/v1/public/contact {
        limit_req zone=contact_api burst=2 nodelay;
        proxy_pass http://fbsantos_site_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_hide_header Access-Control-Allow-Origin;
    }

    location ^~ /api/v1/public/ {
        limit_req zone=public_api burst=50 nodelay;
        proxy_pass http://fbsantos_site_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_hide_header Access-Control-Allow-Origin;
    }

    location ^~ /api/ {
        return 404;
    }

    location ^~ /uploads/ {
        proxy_pass http://fbsantos_site_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Arquivos enviados não precisam ser incorporados como documentos.
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://fbsantos_site_nuxt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
